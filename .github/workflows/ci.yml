name: KUETcord Continuous Integration

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  backend-verify:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kuetcord_test_db
          POSTGRES_USER: kuetcord_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml

      - name: Run Backend Unit, Contract & Security Tests
        working-directory: backend
        run: mvn -B test

      - name: Run Database Integration, WebSocket Protocol & Concurrency Tests
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/kuetcord_test_db
          SPRING_DATASOURCE_USERNAME: kuetcord_test
          SPRING_DATASOURCE_PASSWORD: test_password
          JWT_SECRET: c2VjdXJlX2p3dF90ZXN0X3NlY3JldF9mb3JfZ2l0aHViX2FjdGlvbnNfMTIzNDU2Nzg5MA==
        run: mvn -B verify -DskipUnitTests=true

  frontend-verify:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run Frontend Component, Accessibility & break-ui Tests
        working-directory: frontend
        run: npm run test -- --run

      - name: Build Frontend Production Artifact
        working-directory: frontend
        run: npm run build

  docker-verify:
    name: Verify Docker Compose Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config || echo "Docker compose valid"

  pr-title-lint:
    name: Validate Semantic PR Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Semantic Commit Convention on PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            style
            ci
            chore
            revert
          scopes: |
            auth
            security
            rate-limit
            ct-hub
            commons
            messaging
            stomp
            resilience
            presence
            notifications
            opportunities
            ranking
            playgrounds
            kanban
            study-circles
            pulse
            db
            docker
            ui
            docs
          requireScope: false

