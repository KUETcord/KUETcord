spring:
  application:
    name: kuetcord-backend-test

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kuetcord_test_db}
    username: ${SPRING_DATASOURCE_USERNAME:kuetcord_test}
    password: ${SPRING_DATASOURCE_PASSWORD:test_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

kuetcord:
  jwt:
    secret: c2VjdXJlX2p3dF90ZXN0X3NlY3JldF9mb3JfZ2l0aHViX2FjdGlvbnNfMTIzNDU2Nzg5MA==
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173
  google:
    client-id: test-google-client-id.apps.googleusercontent.com
  frontend-url: http://localhost:5173
